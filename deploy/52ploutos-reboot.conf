// Ploutos: reinicio automatico SOLO cuando un parche lo pide (decision del propietario del 25/09/2026,
// docs/propuesta-actualizaciones.md). Lo instala install.sh en /etc/apt/apt.conf.d/.
//
// Las actualizaciones de seguridad ya se instalan solas entre las 06:00 y las 07:00 UTC y
// needrestart reinicia los servicios afectados. Lo que faltaba: los parches del NUCLEO (o de
// libc) se instalaban pero no entraban en vigor hasta un reinicio que nadie hacia.
//
// Solo reinicia si existe /var/run/reboot-required. A las 07:15: despues de la ventana de
// instalacion y 45 min antes del cierre de la vela de las 08:00; no se pierde ninguna decision.
// Si la maquina no vuelve, avisa Healthchecks; las posiciones reales siguen protegidas por su
// OCO en el exchange.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "07:15";
